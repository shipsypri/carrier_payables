<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invoice Reconciliation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="screen-list.jsx"></script>
  <script type="text/babel" src="screen-detail.jsx"></script>
  <script type="text/babel" src="upload-modal.jsx"></script>

  <script type="text/babel">
    function App() {
      const [invoices, setInvoices] = React.useState(window.SEED_INVOICES);
      const [lineItems, setLineItems] = React.useState(window.LINE_ITEMS);
      const [route, setRoute] = React.useState({ name: 'list', invoiceId: null });
      const [showUpload, setShowUpload] = React.useState(false);
      const [toast, setToast] = React.useState(null);
      // Tab to force the list onto (e.g. after an upload). Bumps a token so
      // the same tab can be re-applied across multiple uploads.
      const [forceTab, setForceTab] = React.useState({ tab: null, token: 0 });
      // Highlight a row briefly after upload so the user can spot it.
      const [highlightId, setHighlightId] = React.useState(null);

      const showToast = (msg, kind = 'success') => {
        setToast({ msg, kind });
        setTimeout(() => setToast(null), 2800);
      };

      const onApprove = (id) => {
        setInvoices(prev => prev.map(i => i.id === id ? { ...i, status: 'approved' } : i));
        const inv = invoices.find(i => i.id === id);
        showToast(`Approved ${inv ? inv.carrier : 'invoice'}`, 'success');
      };
      const onReject = (id) => {
        setInvoices(prev => prev.map(i => i.id === id ? { ...i, status: 'rejected' } : i));
        const inv = invoices.find(i => i.id === id);
        showToast(`Rejected ${inv ? inv.carrier : 'invoice'}`, 'error');
      };

      const onUploadComplete = (newInv, items) => {
        setInvoices(prev => [newInv, ...prev]);
        setLineItems(prev => ({ ...prev, [newInv.id]: items || [] }));
        setShowUpload(false);

        // Jump the list to the tab the AI sorted this invoice into.
        const targetTab =
          newInv.status === 'approved' ? 'approved' :
          newInv.status === 'rejected' ? 'rejected' : 'review';
        setForceTab({ tab: targetTab, token: Date.now() });
        setHighlightId(newInv.id);
        setTimeout(() => setHighlightId(null), 3000);

        // Toast — wording matches the AI's decision
        if (newInv.status === 'approved') {
          showToast(`AI auto-approved ${newInv.carrier} — moved to Approved`, 'success');
        } else if (newInv.status === 'rejected') {
          showToast(`AI flagged ${newInv.carrier} for rejection — moved to Rejected`, 'error');
        } else {
          showToast(`${newInv.carrier} added to Review queue`, 'success');
        }
      };

      const currentInvoice = route.name === 'detail' ? invoices.find(i => i.id === route.invoiceId) : null;

      return (
        <>
          <div className="topbar">
            <div className="topbar-left">
              {Icon.doc(16)}
              <span>Invoice Reconciliation</span>
            </div>
            <div className="topbar-avatar">AD</div>
          </div>

          {route.name === 'list' && (
            <ListScreen
              invoices={invoices}
              onOpenDetail={(id) => setRoute({ name: 'detail', invoiceId: id })}
              onOpenUpload={() => setShowUpload(true)}
              onApprove={onApprove}
              onReject={onReject}
              forceTab={forceTab}
              highlightId={highlightId}
            />
          )}

          {route.name === 'detail' && currentInvoice && (
            <DetailScreen
              invoice={currentInvoice}
              lineItems={lineItems[currentInvoice.id] || []}
              onBack={() => setRoute({ name: 'list', invoiceId: null })}
              onApprove={onApprove}
              onReject={onReject}
            />
          )}

          {showUpload && (
            <UploadModal
              onClose={() => setShowUpload(false)}
              onComplete={onUploadComplete}
            />
          )}

          {toast && (
            <div className={`toast ${toast.kind}`}>
              {toast.kind === 'success' ? Icon.check(14) : Icon.x(14)}
              {toast.msg}
            </div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
